[build]
builder = "RAILPACK"
buildCommand = "cd apps/web && npm ci && npm run build"

[deploy]
startCommand = "cd apps/api && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
