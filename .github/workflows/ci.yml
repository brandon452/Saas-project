name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint, Migrations, And Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventory_main
          POSTGRES_USER: inventory_user
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_user -d inventory_main"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: inventory_main
      DB_USER: inventory_user
      DB_PASSWORD: admin
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DEBUG: "true"
      SECRET_KEY: ci-secret-key-change-me-to-a-long-random-value
      REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Backend Dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Verify Migrations Are Committed
        run: python apps/api/manage.py makemigrations --check --dry-run

      - name: Run Backend Lint
        run: python -m ruff check apps/api

      - name: Run Backend Tests
        run: python apps/api/manage.py test -v 2

  backend-prod-smoke:
    name: Backend Production Smoke Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventory_main
          POSTGRES_USER: inventory_user
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_user -d inventory_main"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_NAME: inventory_main
      DB_USER: inventory_user
      DB_PASSWORD: admin
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_SSL_REQUIRE: "false"
      DEBUG: "false"
      SECRET_KEY: ci-prod-smoke-secret-key-change-me
      REDIS_URL: redis://127.0.0.1:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Backend Dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Run Production Deploy Checks
        working-directory: apps/api
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput --dry-run
          python -m gunicorn config.wsgi:application --check-config

  frontend:
    name: Frontend Lint, Build, And Tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint --workspace=apps/web

      - name: Detect Frontend Test Script
        id: detect_frontend_tests
        shell: bash
        run: |
          if node -e "const s=require('./apps/web/package.json').scripts||{}; process.exit(s.test ? 0 : 1)"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Frontend Tests
        if: steps.detect_frontend_tests.outputs.has_tests == 'true'
        run: npm run test --workspace=apps/web -- --ci

      - name: Run Frontend Build
        run: npm run build --workspace=apps/web
